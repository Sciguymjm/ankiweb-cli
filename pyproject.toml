[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankiweb-cli"
version = "0.1.0"
description = "Headless command-line interface for AnkiWeb"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anki>=24.0",
    "click>=8.1",
    "keyring>=24.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ankiweb-cli = "ankiweb_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests import `ankiweb_cli.collection` before `anki.notes` to warm the import
# cache; importing `anki.notes` first triggers a circular import inside the
# upstream `anki` package.
"tests/*.py" = ["I001"]

[tool.mypy]
strict = true
python_version = "3.11"
